name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: composer validate --strict
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer cs:check
      - run: composer analyse
      - run: vendor/bin/phpunit
      - run: php bin/console nelmio:apidoc:dump --format=yaml > ../frontend/openapi.generated.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/openapi.generated.yaml

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx redocly lint openapi.generated.yaml

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up -d --build --wait
      - name: Проверить API и документацию
        run: |
          curl --fail --retry 5 http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/api/notes
          curl --fail http://127.0.0.1:8080/openapi.yaml
          curl --fail http://127.0.0.1:8080/docs/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
