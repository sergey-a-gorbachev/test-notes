doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    types:
      datetime_immutable_microseconds: App\Infrastructure\Doctrine\MicrosecondDateTimeImmutableType
  orm:
    mappings:
      App:
        type: attribute
        dir: '%kernel.project_dir%/src/Domain/Model'
        prefix: App\Domain\Model
        alias: App
